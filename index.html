<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Surge Snake</title>
    <style>
        /* --- CSS STYLING --- */
        body {
            background-color: #050505; /* Deep black */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace; /* Retro tech font */
            color: #fff;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Disable default touch actions for mobile */
        }

        .game-wrapper {
            position: relative;
            text-align: center;
        }

        #ui-layer {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00f7ff;
            box-sizing: border-box;
            padding: 0 10px;
        }

        canvas {
            background: radial-gradient(circle at center, #111122 0%, #000000 100%);
            box-shadow: 0 0 40px rgba(0, 247, 255, 0.2);
            border: 1px solid #333;
            border-radius: 4px;
            display: block;
            width: min(600px, 90vw, 65vh);
            height: min(600px, 90vw, 65vh);
        }

        /* Instructions Styling */
        .instructions {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .key {
            display: inline-block;
            color: #00f7ff;
            border: 1px solid #00f7ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin: 0 2px;
            box-shadow: 0 0 5px rgba(0, 247, 255, 0.2);
        }

        #game-over-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 1px solid #00f7ff;
            box-shadow: 0 0 30px rgba(0, 247, 255, 0.3);
            min-width: 200px;
        }
        
        button {
            background: transparent;
            border: 2px solid #00f7ff;
            color: #00f7ff;
            padding: 10px 25px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
            transition: all 0.2s ease;
        }
        button:hover {
             background: #00f7ff;
             color: #000;
             box-shadow: 0 0 30px rgba(0, 247, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div id="ui-layer">
            <div>SCORE: <span id="score">0</span></div>
            <div>BEST: <span id="high-score">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div class="instructions">
            [ <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> / <span class="key">ARROWS</span> ] TO START
        </div>

        <div id="game-over-overlay">
            <h1 style="color: #ff0055; text-shadow: 0 0 15px #ff0055; margin:0 0 10px 0;">CRASHED</h1>
            <div style="font-size: 14px; color: #aaa;">FINAL SCORE: <span id="final-score">0</span></div>
            <button id="restart-btn">REBOOT SYSTEM</button>
        </div>
    </div>

    <script src="snake-fx.js"></script>
</body>

</html>
